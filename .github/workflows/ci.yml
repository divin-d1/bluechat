name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/bluechat
      - name: Run tests
        run: pytest -q
      - name: Build wheel and source archive
        run: python -m build
      - name: Verify installed version command
        run: bluechat --version
      - name: Verify installed help command
        run: bluechat --help
      - name: Verify installed diagnostics command
        run: bluechat doctor
